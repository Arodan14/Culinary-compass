<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
   <meta charset="utf-8">
   <meta name="title" content="Culinary Compass">
   <meta name="description" content="This a recipe generator webapp">
   <meta name="viewport" content="width=device-width, initial-scale=1">
           <!--Favicon-->
           <link rel="shortcut icon" href="./favicon.svg" type="image/svg+xml">
           <!--Theme js-->
           <script src="./assets/js/theme.js"></script>    
   <title>Login</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
   <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300,400;500;700&display=swap" rel="stylesheet">
   
   <link rel="stylesheet" href="/assets/css/variables_palette.css" >
   <link rel="stylesheet" href="/assets/css/style.css" >
   <link rel="stylesheet" href="/assets/css/login.css" >
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
   <script src="./assets/js/global.js" type="module"></script>
   

</head>
<body>
           <!-- Header -->
           <header class="header" data-header>
            <a href="/" class="logo">
                <img src="/assets/images/culinary-compass-high-resolution-logo-transparent.svg"
                     height="156" width="80" alt="Culinary compass logo" class="logo-light">
            </a>

            <nav class="navbar">
                <ul class="navbar-list">
                    <li>
                        <a href="/" class="navbar-link title-small has-state active">Home</a>
                    </li>    
                    <li>
                        <a href="./recipes.html" class="navbar-link title-small has-state">Recipes</a>
                    </li>
                </ul>
            </nav>

        </header>

        <!-- Mobile Nav -->
        <nav class="mobile-nav" aria-label="primary">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="./recipes.html" class="nav-link">
                        <span class="item-icon">
                            <span class="material-symbols-outlined" aria-hidden="true">
                                auto_stories
                            </span>
                        </span>

                        <span class="label-medium">Recipes</span>
                    </a>
                </li>
                
                <li class="nav-item">
                    <a href="/" class="nav-link" aria-current="true">
                        <span class="item-icon">
                            <span class="material-symbols-outlined" aria-hidden="true">
                                home
                            </span>
                        </span>

                        <span class="label-medium">Home</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="./saved-recipes.html" class="nav-link">
                        <span class="item-icon">
                            <span class="material-symbols-outlined" aria-hidden="true">
                                book
                            </span>
                        </span>

                        <span class="label-medium">Saved</span>
                    </a>
                </li>

            </ul>
        </nav>
    <main>
        <section class="login">
            <h1>Sign in to your account</h1>
            <form data-auth-form data-auth-mode="login">
               <label for="email" >Email</label>
               <input type="email" id="email" required>
               <label for="password" >Password</label>
               <input type="password" id="password" required>
               <button id="submit" type="submit" data-auth-submit>
                  Login
               </button>
               <p class="message" data-auth-message hidden></p>
               <p>Dont have an account? <a href="register.html">Create one here!</a></p>
            </form>
         </section> 
    </main>
    <script src="./assets/js/login.js" type="module"></script>
</body>
</html>
